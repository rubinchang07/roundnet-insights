spring.application.name=roundnet-insights

# Local database from compose.yaml. Tests ignore these and use Testcontainers.
spring.datasource.url=jdbc:postgresql://localhost:5433/roundnet_insights
spring.datasource.username=roundnet
spring.datasource.password=roundnet

# Flyway owns the schema (ADR 0001). All tables live in the "roundnet" schema,
# and Flyway's own history table goes there too.
spring.flyway.schemas=roundnet
spring.flyway.default-schema=roundnet

# Hibernate never creates or changes tables; it only checks that entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=roundnet
# Keep database access inside service methods, not in the web layer.
spring.jpa.open-in-view=false
